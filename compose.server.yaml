services:
  fairymate-nail:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: fairymate-nail
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3011:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/booking').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - fairymate-nail-internal
      - cloudflare-shared

networks:
  fairymate-nail-internal:
    name: fairymate-nail-internal
  cloudflare-shared:
    external: true
    name: project_web-network
